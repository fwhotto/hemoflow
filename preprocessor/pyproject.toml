[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hemoflow-preprocessor"
version = "1.0.0"
description = "HemoFlow geometry preprocessor for LBM simulations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "numpy-stl>=3.0.0",
    "pynrrd>=1.0.0",
    "vtk>=9.0.0",
    "scipy>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
preprocessor = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
